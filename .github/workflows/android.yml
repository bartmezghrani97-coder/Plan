name: Android-App bauen
on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - name: APK bauen
        working-directory: android
        run: gradle assembleRelease --no-daemon
      - name: APK veröffentlichen
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Arbeitsplan.apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add Arbeitsplan.apk
          git commit -m "Android-App gebaut" || exit 0
          git pull --rebase
          git push
