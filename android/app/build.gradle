plugins { id 'com.android.application' }
android {
  namespace 'de.boyberry.plan'
  compileSdk 34
  defaultConfig { applicationId 'de.boyberry.plan'; minSdk 24; targetSdk 34; versionCode 1; versionName '1.0' }
  signingConfigs { fixed { storeFile file('../plan.keystore'); storePassword 'boyberry'; keyAlias 'plan'; keyPassword 'boyberry' } }
  buildTypes { debug { signingConfig signingConfigs.fixed } release { signingConfig signingConfigs.fixed; minifyEnabled false } }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
